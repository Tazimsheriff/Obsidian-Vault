<?xml version="1.0" encoding="UTF-8"?>
<!-- Life Dashboard Abstraction SVG -->
<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#30363d;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#21262d;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b46c1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  
  <!-- Grid pattern -->
  <g fill="none" stroke="url(#gridGrad)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />
    <line y1="100" x1="0" x2="800" y2="100" />
    <line y1="200" x1="0" x2="800" y2="200" />
    <line y1="300" x1="0" x2="800" y2="300" />
    <line y1="400" x1="0" x2="800" y2="400" />
    <line y1="500" x1="0" x2="800" y2="500" />
  </g>
  
  <!-- Calendar circle (top-left) -->
  <circle cx="150" cy="150" r="60" fill="url(#cyanGrad)" opacity="0.3" />
  <text x="150" y="155" text-anchor="middle" fill="#8b949e" font-size="14" font-family="Inter, system-ui, sans-serif">
    📅 CALNDAR
  </text>
  
  <!-- Quote bubble (top-right) -->
  <path d="M 650 150 Q 700 100 650 50 Q 600 100 650 150" fill="url(#goldGrad)" opacity="0.4" />
  <text x="650" y="145" text-anchor="middle" fill="#f59e0b" font-size="11" font-family="Inter, system-ui, sans-serif" transform="rotate(-20 650 150)">
    💬 QUOTES
  </text>
  
  <!-- Habits square (center-left) -->
  <rect x="50" y="250" width="120" height="120" rx="12" fill="url(#greenGrad)" opacity="0.4" />
  <text x="110" y="295" text-anchor="middle" fill="#8b949e" font-size="10" font-family="Inter, system-ui, sans-serif" transform="rotate(90 110 295)">
    📚 HABITS
  </text>
  
  <!-- Workout circle (center) -->
  <circle cx="400" cy="300" r="70" fill="url(#purpleGrad)" opacity="0.3" />
  <text x="400" y="310" text-anchor="middle" fill="#8b949e" font-size="14" font-family="Inter, system-ui, sans-serif">
    💪 WORKOUT
  </text>
  
  <!-- Goals triangle (center-right) -->
  <polygon points="700,200 750,400 650,400" fill="url(#goldGrad)" opacity="0.3" />
  <text x="725" y="350" text-anchor="middle" fill="#8b949e" font-size="10" font-family="Inter, system-ui, sans-serif" transform="rotate(90 725 350)">
    🎯 GOALS
  </text>
  
  <!-- Poem diamond (bottom-right) -->
  <polygon points="700,500 750,550 700,580 650,550" fill="url(#goldGrad)" opacity="0.3" />
  <text x="725" y="540" text-anchor="middle" fill="#8b949e" font-size="10" font-family="Inter, system-ui, sans-serif">
    📜 POEMS
  </text>
  
  <!-- Central motif - dashboard icon -->
  <g fill="#e6edf3">
    <rect x="350" y="370" width="100" height="60" rx="8" />
    <line x1="350" y1="370" x2="450" y2="370" />
    <line x1="350" y1="430" x2="450" y2="430" />
    <line x1="400" y1="370" x2="400" y2="470" />
    <circle cx="400" cy="420" r="8" fill="#fff" />
  </g>
  
  <!-- Accent lines connecting the elements -->
  <g stroke-width="2">
    <line x1="150" y1="150" x2="50" y2="250" stroke="url(#greenGrad)" opacity="0.6" />
    <line x1="150" y1="150" x2="500" y2="300" stroke="url(#purpleGrad)" opacity="0.6" />
    <line x1="150" y1="150" x2="750" y2="500" stroke="url(#goldGrad)" opacity="0.4" />
    <line x1="400" y1="300" x2="700" y2="500" stroke="url(#cyanGrad)" opacity="0.5" />
  </g>
  
  <!-- Title at bottom -->
  <text x="400" y="580" text-anchor="middle" fill="#8b949e" font-size="16" font-family="Inter, system-ui, sans-serif">
    LIFE DASHBOARD ABSTRACTION
  </text>
  <text x="400" y="595" text-anchor="middle" fill="#5c636b" font-size="11" font-family="Inter, system-ui, sans-serif">
    Journal • Quotes • Tasks • Calendar • Goals • Habits • Poems
  </text>
</svg>